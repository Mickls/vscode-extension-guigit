name: Release VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.33. Defaults to v<extension version>."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Package VSIX
        run: pnpm package

      - name: Read extension metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./packages/extension/package.json').version")"
          NAME="$(node -p "require('./packages/extension/package.json').name")"
          TAG="${GITHUB_REF_NAME}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v${VERSION}}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "${GITHUB_OUTPUT}"

      - name: Ensure tag matches extension version
        run: test "v${{ steps.meta.outputs.version }}" = "${{ steps.meta.outputs.tag }}"

      - name: Create or update GitHub release
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          VSIX_PATH="packages/extension/${{ steps.meta.outputs.vsix }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${VSIX_PATH}" --clobber
          else
            gh release create "${TAG}" "${VSIX_PATH}" \
              --title "${TAG}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi
